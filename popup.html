<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS Survey Auto-Filler</title>
  <style>
    :root {
      --bg: rgba(255, 255, 255, 0.88);
      --surface: rgba(241, 245, 249, 0.7);
      --border: rgba(226, 232, 240, 0.85);
      --border-subtle: rgba(226, 232, 240, 0.6);
      --text: #0f172a;
      --text-muted: #64748b;
      --btn-glass: rgba(255, 255, 255, 0.75);
      --btn-border: rgba(203, 213, 225, 0.6);
      --btn-hover: rgba(255, 255, 255, 0.95);
      --specular: inset 0 1px 1px rgba(255, 255, 255, 0.9);
    }

    [data-theme="dark"] {
      --bg: rgba(15, 23, 42, 0.88);
      --surface: rgba(30, 41, 59, 0.6);
      --border: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.07);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --btn-glass: rgba(30, 41, 59, 0.65);
      --btn-border: rgba(255, 255, 255, 0.1);
      --btn-hover: rgba(51, 65, 85, 0.7);
      --specular: inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", system-ui, sans-serif !important;
      -webkit-font-smoothing: antialiased !important;
      -moz-osx-font-smoothing: grayscale !important;
      text-rendering: optimizeLegibility !important;
      transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }

    body {
      width: 318px;
      background: var(--bg);
      color: var(--text);
      padding: 0;
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      overflow: hidden;
    }

    .header {
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .title-group .icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1px solid rgba(99, 102, 241, 0.4);
      background: rgba(99, 102, 241, 0.12);
      color: #818cf8;
    }

    .title-group h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .badge {
      font-size: 9.5px;
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      padding: 1.5px 6.5px;
      border-radius: 9999px;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .theme-btn {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      cursor: pointer;
      width: 27px;
      height: 27px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .theme-btn:hover {
      color: var(--text);
      transform: scale(1.05);
    }

    .body {
      padding: 12px 14px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      padding: 6.5px 11px;
      border-radius: 9px;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.35;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3b82f6;
      flex-shrink: 0;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    button.btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 36px;
      padding: 0 11px;
      border-radius: 10px;
      border: 1px solid var(--btn-border);
      background: var(--btn-glass);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: var(--specular);
      transition: all 0.18s cubic-bezier(0.32, 0.72, 0, 1);
    }

    button.btn:hover {
      background: var(--btn-hover);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-0.5px);
    }

    button.btn:active {
      transform: scale(0.98);
    }

    .btn-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vector-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      color: var(--text-muted);
    }

    button.btn:hover .vector-icon {
      color: var(--text);
    }

    .btn-sub {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 1.5px 6.5px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    button.btn-smart {
      border: 1px solid rgba(99, 102, 241, 0.4) !important;
      background: rgba(99, 102, 241, 0.12) !important;
      color: var(--text) !important;
    }
    button.btn-smart .vector-icon {
      color: #818cf8 !important;
    }
    button.btn-smart:hover {
      background: rgba(99, 102, 241, 0.2) !important;
      border-color: rgba(99, 102, 241, 0.6) !important;
    }
    button.btn-smart .btn-sub {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    button.btn-primary {
      border: 1px solid rgba(16, 185, 129, 0.4) !important;
      background: rgba(16, 185, 129, 0.1) !important;
      color: var(--text) !important;
    }
    button.btn-primary .vector-icon {
      color: #10b981 !important;
    }
    button.btn-primary:hover {
      background: rgba(16, 185, 129, 0.18) !important;
      border-color: rgba(16, 185, 129, 0.6) !important;
    }
    button.btn-primary .btn-sub {
      background: rgba(16, 185, 129, 0.18);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

  </style>
</head>
<body data-theme="dark">
  <div class="header">
    <div class="title-group">
      <div class="icon-wrap">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <h1>Survey Auto-Filler</h1>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <span class="badge">v1.4</span>
      <button class="theme-btn" id="popup-theme-toggle" title="Toggle Theme">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
    </div>
  </div>

  <div class="body">
    <div class="status-card" id="status-box">
      <span class="status-dot"></span>
      <span id="status-text">Scanning active tab...</span>
    </div>

    <div class="actions">
      <button class="btn btn-smart" id="btn-smart">
        <span class="btn-label">
          <span class="vector-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
          </span>
          <span>Smart Realistic</span>
        </span>
        <span class="btn-sub">Bell Curve</span>
      </button>

      <button class="btn btn-primary" id="btn-all5">
        <span class="btn-label">
          <span class="vector-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </span>
          <span>Straight 5s</span>
        </span>
        <span class="btn-sub">All 5</span>
      </button>

      <button class="btn" id="btn-natural">
        <span class="btn-label">
          <span class="vector-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
          </span>
          <span>High Achiever</span>
        </span>
        <span class="btn-sub">80/20</span>
      </button>

      <button class="btn" id="btn-all4">
        <span class="btn-label">
          <span class="vector-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          </span>
          <span>Solid 4s</span>
        </span>
        <span class="btn-sub">All 4</span>
      </button>

      <button class="btn" id="btn-random">
        <span class="btn-label">
          <span class="vector-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.6-8.6c.8-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.4c1.3 0 2.5.6 3.3 1.7l1.7 2.2"/><path d="M14.6 13.9l2.1 2.4c.8 1.1 2 1.7 3.3 1.7H22"/><path d="m18 14 4 4-4 4"/></svg>
          </span>
          <span>Randomize</span>
        </span>
        <span class="btn-sub">1 - 5</span>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
